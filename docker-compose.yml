services:
  postgres:
    image: postgres:16-alpine
    container_name: support_dev_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pg_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-support_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_dev} -d ${POSTGRES_DB:-support_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: support_dev_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-support_dev}
      MYSQL_USER: ${MYSQL_USER:-support_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_mysql_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-support_dev}", "-p${MYSQL_PASSWORD:-dev_mysql_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: support_dev_mssql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1435}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DevPass_2026!}
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./docker/init/mssql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-DevPass_2026!}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-DevPass_2026!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  mysql_data:
  mssql_data:
