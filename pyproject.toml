[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support"
dynamic = ["version"]
description = "A developer-first, terminal-native database intelligence and operations workspace."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Support Team" }
]
dependencies = [
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
support = "support.cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "support.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
