[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-db"
dynamic = ["version"]
description = "A developer-first, terminal-native database intelligence and operations workspace."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Support Team" }
]
dependencies = [
    "typer>=0.15.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
mysql = [
    "PyMySQL[rsa]>=1.2.4,<2",
]
sqlserver = [
    "mssql-python>=1.18.0,<2",
]
mongodb = [
    "pymongo>=4.10,<5",
]
all = [
    "psycopg[binary]>=3.2,<4",
    "PyMySQL[rsa]>=1.2.4,<2",
    "mssql-python>=1.18.0,<2",
    "pymongo>=4.10,<5",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
support = "support.cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "support.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
